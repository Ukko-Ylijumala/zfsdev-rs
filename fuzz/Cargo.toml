[package]
name = "zfsdev-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# its own workspace: libFuzzer (C++, nightly) never enters the crate's
# pure-Rust, stable dep graph
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.zfsdev]
path = ".."

[profile.release]
debug = 1

[[bin]]
name = "nvlist"
path = "fuzz_targets/nvlist.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kstat"
path = "fuzz_targets/kstat.rs"
test = false
doc = false
bench = false
